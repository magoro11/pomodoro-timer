<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bright Timer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #1f2a22;
    --panel: #2b3a2e;
    --cream: #fbf7ec;
    --cream-dim: #d9d2c1;
    --box-bg: #fbf7ec;
    --box-ink: #241d17;
    --tomato: #c1440e;
    --tomato-dark: #8c2f0b;
    --tomato-glow: rgba(193,68,14,0.35);
    --vine: #5b8c5a;
    --vine-dark: #3e6440;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(circle at 15% 8%, rgba(91,140,90,0.18), transparent 45%),
      radial-gradient(circle at 85% 95%, rgba(193,68,14,0.12), transparent 40%),
      var(--bg);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    display:flex;
    justify-content:center;
    padding: 40px 16px 56px;
  }

  .app{
    width: 100%;
    max-width: 380px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .eyebrow{
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--vine);
    font-weight: 700;
    margin-bottom: 10px;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .sub{
    margin: 0 0 30px;
    font-size: 13.5px;
    color: var(--cream-dim);
    text-align:center;
    line-height:1.5;
    max-width: 260px;
  }

  /* ---- Rectangular display box ---- */
  .box-wrap{
    width: 100%;
    margin-bottom: 26px;
  }

  .display-box{
    background: var(--box-bg);
    color: var(--box-ink);
    border-radius: 22px;
    padding: 30px 24px 24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow: 0 14px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.4);
    position: relative;
    overflow: hidden;
  }

  .display-box::before{
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height: 6px;
    background: var(--tomato);
    transition: background 0.3s ease;
  }
  .display-box.break-mode::before{
    background: var(--vine);
  }

  .mode-label{
    font-size: 11.5px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--tomato);
    font-weight: 700;
    margin-bottom: 8px;
    transition: color 0.3s ease;
  }
  .mode-label.break{ color: var(--vine); }

  .time{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 54px;
    line-height: 1;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    margin-bottom: 20px;
  }

  .progress-track{
    width: 100%;
    height: 8px;
    background: rgba(36,29,23,0.12);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .progress-fill{
    height: 100%;
    width: 100%;
    background: var(--tomato);
    border-radius: 999px;
    transition: width 0.3s linear, background 0.3s ease;
  }
  .progress-fill.break-mode{
    background: var(--vine);
  }

  .btn-row{
    display:flex;
    gap: 10px;
  }

  button{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    border-radius: 999px;
    padding: 9px 20px;
    cursor: pointer;
    border: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  button:active{ transform: scale(0.96); }
  button:focus-visible{ outline: 2px solid var(--box-ink); outline-offset: 2px; }

  .btn-primary{
    background: var(--tomato);
    color: var(--cream);
    box-shadow: 0 6px 16px var(--tomato-glow);
  }
  .btn-primary:hover{ filter: brightness(1.08); }
  .btn-primary.is-running{
    background: var(--tomato-dark);
  }

  .btn-ghost{
    background: transparent;
    color: var(--box-ink);
    border: 1px solid rgba(36,29,23,0.25);
  }
  .btn-ghost:hover{ border-color: var(--box-ink); }

  /* ---- Length knobs ---- */
  .knobs{
    display:flex;
    gap: 14px;
    width: 100%;
    margin-bottom: 22px;
  }

  .knob{
    flex:1;
    background: var(--panel);
    border-radius: 16px;
    padding: 14px 10px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow: inset 0 1px 0 rgba(251,247,236,0.06), 0 4px 10px rgba(0,0,0,0.2);
  }

  .knob-controls{
    display:flex;
    align-items:center;
    gap: 14px;
    margin-bottom: 8px;
  }

  .stepper{
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(251,247,236,0.08);
    color: var(--cream);
    font-size: 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    line-height:1;
  }
  .stepper:hover:not(:disabled){ background: rgba(251,247,236,0.16); }
  .stepper:disabled{ opacity: 0.35; cursor: not-allowed; }

  .knob-value{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 19px;
    min-width: 54px;
    text-align:center;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .knob-label{
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--cream-dim);
    font-weight: 600;
  }

  /* ---- Session tracker: little tomatoes ---- */
  .tracker{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 10px;
  }

  .tomatoes{
    display:flex;
    gap: 7px;
    flex-wrap: wrap;
    justify-content:center;
    max-width: 260px;
  }

  .tomato-dot{
    width: 14px;
    height: 14px;
    border-radius: 50% 50% 55% 55%;
    background: rgba(251,247,236,0.10);
    position: relative;
    transition: background 0.3s ease, transform 0.3s ease;
  }
  .tomato-dot::before{
    content:'';
    position:absolute;
    top: -3px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 4px;
    background: rgba(251,247,236,0.10);
    border-radius: 2px;
    transition: background 0.3s ease;
  }
  .tomato-dot.filled{
    background: var(--tomato);
    transform: scale(1.05);
  }
  .tomato-dot.filled::before{
    background: var(--vine);
  }

  .tracker-caption{
    font-size: 12.5px;
    color: var(--cream-dim);
    text-align:center;
  }
  .tracker-caption b{
    color: var(--cream);
    font-weight: 700;
  }

</style>
</head>
<body>

<div class="app">
  <div class="eyebrow">Focus Room</div>
  <h1>Bright Timer</h1>
  <p class="sub">Set your own focus and break lengths, then start the clock.</p>

  <div class="box-wrap">
    <div class="display-box" id="displayBox">
      <div class="mode-label" id="modeLabel">Session</div>
      <div class="time" id="timeDisplay">25:00</div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="startBtn">Start</button>
        <button class="btn-ghost" id="resetBtn">Reset</button>
      </div>
    </div>
  </div>

  <div class="knobs">
    <div class="knob">
      <div class="knob-controls">
        <button class="stepper" id="breakMinus">–</button>
        <div class="knob-value" id="breakValue">5</div>
        <button class="stepper" id="breakPlus">+</button>
      </div>
      <div class="knob-label">Break Length</div>
    </div>
    <div class="knob">
      <div class="knob-controls">
        <button class="stepper" id="sessionMinus">–</button>
        <div class="knob-value" id="sessionValue">25</div>
        <button class="stepper" id="sessionPlus">+</button>
      </div>
      <div class="knob-label">Session Length</div>
    </div>
  </div>

  <div class="tracker">
    <div class="tomatoes" id="tomatoes"></div>
    <div class="tracker-caption" id="caption"><b>0</b> sessions completed today</div>
  </div>
</div>

<script>
  const state = {
    sessionLen: 25,
    breakLen: 5,
    mode: 'session',
    remaining: 25 * 60,
    running: false,
    completed: 0,
    intervalId: null
  };

  const el = {
    time: document.getElementById('timeDisplay'),
    modeLabel: document.getElementById('modeLabel'),
    startBtn: document.getElementById('startBtn'),
    resetBtn: document.getElementById('resetBtn'),
    displayBox: document.getElementById('displayBox'),
    progressFill: document.getElementById('progressFill'),
    sessionValue: document.getElementById('sessionValue'),
    breakValue: document.getElementById('breakValue'),
    sessionMinus: document.getElementById('sessionMinus'),
    sessionPlus: document.getElementById('sessionPlus'),
    breakMinus: document.getElementById('breakMinus'),
    breakPlus: document.getElementById('breakPlus'),
    tomatoes: document.getElementById('tomatoes'),
    caption: document.getElementById('caption')
  };

  function formatTime(sec){
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60).toString().padStart(2,'0');
    const s = Math.floor(sec % 60).toString().padStart(2,'0');
    if(h > 0){
      return h + ':' + m + ':' + s;
    }
    return Math.floor(sec / 60).toString().padStart(2,'0') + ':' + s;
  }

  function formatKnobValue(min){
    if(min < 60) return String(min);
    const h = Math.floor(min / 60);
    const m = min % 60;
    return h + 'h' + (m ? ' ' + m + 'm' : '');
  }

  function totalForMode(mode){
    return (mode === 'session' ? state.sessionLen : state.breakLen) * 60;
  }

  function render(){
    el.time.textContent = formatTime(state.remaining);
    el.modeLabel.textContent = state.mode === 'session' ? 'Session' : 'Break';
    el.modeLabel.classList.toggle('break', state.mode === 'break');
    el.displayBox.classList.toggle('break-mode', state.mode === 'break');
    el.progressFill.classList.toggle('break-mode', state.mode === 'break');

    const total = totalForMode(state.mode);
    const frac = total > 0 ? state.remaining / total : 0;
    el.progressFill.style.width = (frac * 100).toFixed(2) + '%';

    el.startBtn.textContent = state.running ? 'Pause' : 'Start';
    el.startBtn.classList.toggle('is-running', state.running);

    el.sessionValue.textContent = formatKnobValue(state.sessionLen);
    el.breakValue.textContent = formatKnobValue(state.breakLen);

    const disableAdjust = state.running;
    el.sessionMinus.disabled = disableAdjust || state.sessionLen <= 5;
    el.sessionPlus.disabled = disableAdjust || state.sessionLen >= 240;
    el.breakMinus.disabled = disableAdjust || state.breakLen <= 1;
    el.breakPlus.disabled = disableAdjust || state.breakLen >= 30;

    renderTomatoes();
    el.caption.innerHTML = '<b>' + state.completed + '</b> session' + (state.completed === 1 ? '' : 's') + ' completed today';
  }

  function renderTomatoes(){
    const slots = Math.max(8, state.completed);
    el.tomatoes.innerHTML = '';
    for(let i = 0; i < slots; i++){
      const dot = document.createElement('div');
      dot.className = 'tomato-dot' + (i < state.completed ? ' filled' : '');
      el.tomatoes.appendChild(dot);
    }
  }

  function beep(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 660;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
      osc.start();
      osc.stop(ctx.currentTime + 0.55);
    }catch(e){ /* audio not available */ }
  }

  function tick(){
    state.remaining -= 1;
    if(state.remaining <= 0){
      beep();
      if(state.mode === 'session'){
        state.completed += 1;
        state.mode = 'break';
      } else {
        state.mode = 'session';
      }
      state.remaining = totalForMode(state.mode);
    }
    render();
  }

  function start(){
    state.running = true;
    state.intervalId = setInterval(tick, 1000);
    render();
  }

  function pause(){
    state.running = false;
    clearInterval(state.intervalId);
    render();
  }

  el.startBtn.addEventListener('click', () => {
    if(state.running) pause(); else start();
  });

  el.resetBtn.addEventListener('click', () => {
    pause();
    state.mode = 'session';
    state.remaining = totalForMode('session');
    render();
  });

  function adjust(kind, delta){
    if(state.running) return;
    if(kind === 'session'){
      state.sessionLen = Math.min(240, Math.max(5, state.sessionLen + delta));
      if(state.mode === 'session') state.remaining = totalForMode('session');
    } else {
      state.breakLen = Math.min(30, Math.max(1, state.breakLen + delta));
      if(state.mode === 'break') state.remaining = totalForMode('break');
    }
    render();
  }

  el.sessionMinus.addEventListener('click', () => adjust('session', -1));
  el.sessionPlus.addEventListener('click', () => adjust('session', 1));
  el.breakMinus.addEventListener('click', () => adjust('break', -1));
  el.breakPlus.addEventListener('click', () => adjust('break', 1));

  render();
</script>

</body>
</html>
